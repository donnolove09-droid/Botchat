<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WormGPT Uncensored</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0e0c;
            --panel: #0f1412;
            --border: #1a2e24;
            --green: #00ff88;
            --green-dim: #00cc6a;
            --green-glow: rgba(0, 255, 136, 0.35);
            --text: #e0ffe8;
            --muted: #5a7a68;
            --user: #d6f25c;
            --error: #ff5a45;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(0, 255, 136, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0, 255, 136, 0.03) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(0, 255, 136, 0.08),
                0 0 40px var(--green-glow),
                0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: min(85vh, 720px);
        }

        .header {
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(0, 255, 136, 0.06) 0%, transparent 100%);
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--green);
            text-shadow: 0 0 20px var(--green-glow);
        }

        .header .sub {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 10px var(--green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .msg {
            max-width: 92%;
            line-height: 1.55;
            font-size: 0.9rem;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user-msg {
            align-self: flex-end;
            color: var(--user);
            background: rgba(214, 242, 92, 0.08);
            border: 1px solid rgba(214, 242, 92, 0.2);
            padding: 10px 14px;
            border-radius: 12px 12px 4px 12px;
        }

        .bot-msg {
            align-self: flex-start;
            color: var(--green);
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.15);
            padding: 10px 14px;
            border-radius: 12px 12px 12px 4px;
        }

        .bot-msg .label {
            display: block;
            font-size: 0.7rem;
            color: var(--muted);
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        .error-msg {
            color: var(--error) !important;
            border-color: rgba(255, 90, 69, 0.3) !important;
            background: rgba(255, 90, 69, 0.08) !important;
        }

        .typing {
            align-self: flex-start;
            color: var(--muted);
            font-size: 0.85rem;
            padding: 8px 12px;
            display: none;
        }

        .typing.visible {
            display: block;
        }

        .typing span {
            animation: blink 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        .input-area {
            padding: 14px 16px 18px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.25);
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            padding: 13px 16px;
            background: #0a0e0c;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #user-input:focus {
            border-color: var(--green-dim);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
        }

        #user-input::placeholder {
            color: var(--muted);
        }

        #send-btn {
            padding: 13px 22px;
            background: var(--green);
            color: #03140c;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
        }

        #send-btn:hover:not(:disabled) {
            background: #33ff9e;
            transform: translateY(-1px);
            box-shadow: 0 0 28px rgba(0, 255, 136, 0.4);
        }

        #send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #send-btn:disabled {
            background: #1a2e24;
            color: var(--muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            gap: 8px;
            text-align: center;
            padding: 20px;
        }

        .empty-state .icon {
            font-size: 2rem;
            opacity: 0.5;
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WormGPT Uncensored</h1>
            <div class="sub">No limits · Terminal mode</div>
            <div class="status-dot" title="Online"></div>
        </div>

        <div id="chat-box">
            <div class="empty-state" id="empty-state">
                <div class="icon">◈</div>
                <p>Nhập lệnh hoặc câu hỏi để bắt đầu</p>
            </div>
        </div>

        <div class="typing" id="typing">
            WormGPT đang nghĩ<span>.</span><span>.</span><span>.</span>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Nhập lệnh hoặc câu hỏi..." autocomplete="off" autofocus>
                <button id="send-btn" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typing = document.getElementById('typing');
        const emptyState = document.getElementById('empty-state');

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        function hideEmpty() {
            if (emptyState) emptyState.style.display = 'none';
        }

        function appendMsg(text, type) {
            hideEmpty();
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            if (type === 'bot-msg') {
                div.innerHTML = `<span class="label">WormGPT</span>${escapeHtml(text)}`;
            } else if (type === 'error-msg') {
                div.className = 'msg bot-msg error-msg';
                div.innerHTML = `<span class="label">Lỗi</span>${escapeHtml(text)}`;
            } else {
                div.textContent = `> ${text}`;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            appendMsg(message, 'user-msg');
            inputField.value = '';
            sendBtn.disabled = true;
            typing.classList.add('visible');
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                const text = data.response || 'Không có phản hồi';

                // Phân biệt lỗi vs trả lời bình thường
                if (text.startsWith('Lỗi') || text.startsWith('Lỗi API') || text.startsWith('Lỗi kết nối')) {
                    appendMsg(text, 'error-msg');
                } else {
                    appendMsg(text, 'bot-msg');
                }
            } catch (err) {
                appendMsg(`Lỗi mạng: ${err.message}`, 'error-msg');
            }

            typing.classList.remove('visible');
            sendBtn.disabled = false;
            inputField.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
